# Конфигурация логирования для logging.config.dictConfig (config_log.py).
# Словарь перенесён 1:1 из create_config_dict; filename хендлера rotating_file1
# подставляется в коде (_load_logging_config), поэтому здесь строка-заглушка.
# Файл читается с encoding="utf-8" — русские комментарии допустимы.

version: 1
disable_existing_loggers: False

root:
  level: WARNING
  handlers: []

formatters:
  form1:
    format: "/* %(asctime)s - %(module)s.%(funcName)s(%(lineno)d) - [%(threadName)s] - %(thread)d - [%(processName)s] - %(process)d */ -> \n%(levelname)s: %(message)s"
  form2:
    format: "/* %(asctime)s - %(module)s.%(funcName)s(%(lineno)d) - [%(threadName)s] - [%(thread)d] */  \n%(levelname)s: %(message)s"
  form3:
    format: "/* %(asctime)s - %(module)s.%(funcName)s(%(lineno)d) - %(name)s */ -> \n%(levelname)s: %(message)s"
  form4:
    format: "/* %(asctime)s - %(module)s.%(funcName)s(%(lineno)d) - [%(processName)s] - %(process)d */ -> \n%(levelname)s: %(message)s"
  con1:
    format: "%(asctime)s - %(module)s.%(funcName)s(%(lineno)d) - [%(threadName)s] - [%(thread)d] \n > %(levelname)s: %(message)s"
  con2:
    format: "%(asctime)s - %(module)s.%(funcName)s(%(lineno)d) - [%(threadName)s] - [%(thread)d] > %(levelname)s: %(message)s"

handlers:
  rotating_file1:
    class: logging.handlers.RotatingFileHandler
    formatter: form2
    filename: "one_fast.log"
    maxBytes: 1048576
    backupCount: 20
  console1:
    class: logging.StreamHandler
    formatter: con2
    stream: ext://sys.stdout

loggers:
  Stdout:
    handlers: ["console1"]
    level: INFO
  FileStdout:
    handlers: ["rotating_file1", "console1"]
    level: INFO
  OnlyFile:
    handlers: ["rotating_file1"]
#    level: INFO
    level: DEBUG

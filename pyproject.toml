[project]
name = "temp-auth-react-fast"
version = "1.0.0"

requires-python = ">=3.12"

dependencies = [
    "ruff>=0.14.10",
    "black>=25.0.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.40.0",
    "pydantic[email]>=2.7.1,<3",
    "pydantic-settings>=2.2.1,<3",
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "asyncpg>=0.31.0",
    "alembic>=1.13.1,<2",
    "gunicorn>=23.0.0,<24",
    "orjson>=3.11.5",
    "aiosqlite>=0.22.1",
    "python-multipart>=0.0.18",
    "pyyaml>=6.0.2",
    "fastapi-users[sqlalchemy]>=14.0.1",
]

[tool.uv]
package = false



[tool.ruff.lint]
ignore = [
    "F401",
    "E402",
    "F541"
]



[tool.ruff]
line-length = 100
indent-width = 4
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    ".vscode",
    "__pypackages__",
    "__pycache__",
    "_build",
    "build",
    "dist",
    "node_modules",
    "site-packages"
]




[tool.black]
line-length = 120
exclude = '''
/(
  # directories
  \.venv
  | venv
  | \.git
  | \.log
  | \.mypy_cache
  | \.tox
  | build
  | dist
)/
'''
